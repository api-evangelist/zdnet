naftiko: 1.0.0-alpha2
info:
  label: ZDNet RSS Feed API — News
  description: 'ZDNet RSS Feed API — News. 3 operations. Lead operation: ZDNet Get News RSS Feed. Self-contained Naftiko capability
    covering one Zdnet business surface.'
  tags:
  - Zdnet
  - News
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ZDNET_API_KEY: ZDNET_API_KEY
capability:
  consumes:
  - type: http
    namespace: rss-news
    baseUri: https://www.zdnet.com
    description: ZDNet RSS Feed API — News business capability. Self-contained, no shared references.
    resources:
    - name: news-rss.xml
      path: /news/rss.xml
      operations:
      - name: getnewsrssfeed
        method: GET
        description: ZDNet Get News RSS Feed
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: topic-developer-rss.xml
      path: /topic/developer/rss.xml
      operations:
      - name: getdeveloperrssfeed
        method: GET
        description: ZDNet Get Developer RSS Feed
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: topic-innovation-rss.xml
      path: /topic/innovation/rss.xml
      operations:
      - name: getinnovationrssfeed
        method: GET
        description: ZDNet Get Innovation RSS Feed
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: rss-news-rest
    port: 8080
    description: REST adapter for ZDNet RSS Feed API — News. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/news/rss-xml
      name: news-rss-xml
      description: REST surface for news-rss.xml.
      operations:
      - method: GET
        name: getnewsrssfeed
        description: ZDNet Get News RSS Feed
        call: rss-news.getnewsrssfeed
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/topic/developer/rss-xml
      name: topic-developer-rss-xml
      description: REST surface for topic-developer-rss.xml.
      operations:
      - method: GET
        name: getdeveloperrssfeed
        description: ZDNet Get Developer RSS Feed
        call: rss-news.getdeveloperrssfeed
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/topic/innovation/rss-xml
      name: topic-innovation-rss-xml
      description: REST surface for topic-innovation-rss.xml.
      operations:
      - method: GET
        name: getinnovationrssfeed
        description: ZDNet Get Innovation RSS Feed
        call: rss-news.getinnovationrssfeed
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rss-news-mcp
    port: 9090
    transport: http
    description: MCP adapter for ZDNet RSS Feed API — News. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: zdnet-get-news-rss-feed
      description: ZDNet Get News RSS Feed
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rss-news.getnewsrssfeed
      outputParameters:
      - type: object
        mapping: $.
    - name: zdnet-get-developer-rss-feed
      description: ZDNet Get Developer RSS Feed
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rss-news.getdeveloperrssfeed
      outputParameters:
      - type: object
        mapping: $.
    - name: zdnet-get-innovation-rss-feed
      description: ZDNet Get Innovation RSS Feed
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rss-news.getinnovationrssfeed
      outputParameters:
      - type: object
        mapping: $.
