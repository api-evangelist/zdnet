name: ZDNet
description: >-
  ZDNet is a business technology news website owned by Ziff Davis, covering enterprise IT, cybersecurity, cloud
  computing, hardware, software, and innovation for IT professionals and tech-savvy business leaders. ZDNet provides
  news, analysis, product reviews, and how-to guides. No public developer API is available; content is accessible via
  RSS feeds.
